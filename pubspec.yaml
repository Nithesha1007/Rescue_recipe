name: rescue_recipe
description: Voice-first AI food rescue app. Speak your ingredients, rescue your food, reduce food waste.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7
  get_it: ^8.0.3
  fpdart: ^1.1.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.3.0
  cached_network_image: ^3.4.1
  speech_to_text: ^7.0.0
  connectivity_plus: ^6.1.3
  permission_handler: ^11.4.0
  flutter_tts: ^4.2.2
  wakelock_plus: ^1.2.8
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  flutter_timezone: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
